<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Royal Bed studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; max-width: min(100%, 1280px); max-height: 85vh; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="../../engine/flat/core.js"></script>
<script src="../../engine/clawd.js"></script>  <!-- for emote() only -->
<script src="../../engine/flat/timeline.js"></script>
<script src="../../engine/acting.js"></script>
<!-- cast: Pumpkin & Pip (shared by the series) -->
<script src="../../engine/cast/pumpkin_pip.js"></script>
<script src="../../engine/cast/sheet.js"></script>
<!-- reference sheets (standalone loops) -->
<!-- your video: add a script per scene file, in order -->
<script src="src/dialog.js"></script>
<script src="src/subs.js"></script>
<script src="src/props.js"></script>
<script src="src/scenes/shots.js"></script>
<script src="src/cover.js"></script>
<script src="src/cram_options.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
